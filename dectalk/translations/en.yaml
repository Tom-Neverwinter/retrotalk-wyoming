configuration:
  voice:
    name: Default voice
    description: >-
      Used when a request doesn't pick a voice. A built-in (paul, betty, harry, frank,
      dennis, kit, ursula, rita, wendy) or the name of one of your custom voices.
  rate:
    name: Speaking rate
    description: Words per minute for every voice (75-600). Leave unset for DECtalk's default.
  languages:
    name: Languages
    description: >-
      Built-in voices to offer per language: us (US English), uk (UK English), gr (German),
      sp (Spanish, Spain), la (Spanish, Latin America), fr (French). Non-US voices are named
      like paul_gr.
  custom_voices:
    name: Custom voices
    description: >-
      Extra voices built from a base voice plus DECtalk design-voice settings,
      e.g. "ap 90 pr 0", with an optional language (default us). See the Documentation tab.
network:
  10205/tcp: >-
    Wyoming port on the host. Not needed for Home Assistant itself; only enable it for
    Wyoming clients on other machines.
