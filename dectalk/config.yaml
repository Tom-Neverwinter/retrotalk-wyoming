name: DECtalk TTS
version: "0.4.0"
slug: dectalk
description: DECtalk as a Wyoming text-to-speech server
url: https://github.com/Tom-Neverwinter/dectalk-wyoming
arch:
  - amd64
  - aarch64
init: false
startup: services
boot: auto
discovery:
  - wyoming
ports:
  10205/tcp: null
options:
  voice: kitt
  custom_voices:
    - name: kitt
      base: paul
      settings: ap 125 pr 120 ri 70 hs 95 as 70
      rate: 185
    - name: hal
      base: paul
      settings: ap 95 pr 35 sm 70 hs 105 as 30
      rate: 150
    - name: robot
      base: paul
      settings: pr 0 ap 90
schema:
  voice: match(^[a-z0-9_-]+$)
  rate: int(75,600)?
  custom_voices:
    - name: match(^[a-z0-9_-]+$)
      base: list(paul|betty|harry|frank|dennis|kit|ursula|rita|wendy)
      settings: match(^[a-z0-9 ]*$)?
      rate: int(75,600)?
