blueprint:
  name: DECtalk announce
  description: >-
    Speak a message on one designated speaker per room. Put the chosen label on one
    media player (or its device) in each area. Call with `areas` for specific rooms,
    `speakers` for specific media players, or neither for everywhere. Supports a mute
    switch, quiet hours, a priority override, and a temporary volume that is restored
    afterwards. Announcements queue up and never talk over each other.
  domain: script
  source_url: https://github.com/Tom-Neverwinter/dectalk-wyoming/blob/main/blueprints/script/dectalk_announce.yaml
  homeassistant:
    min_version: 2024.4.0
  input:
    tts_entity:
      name: DECtalk TTS entity
      selector:
        entity:
          filter:
            domain: tts
    announcer_label:
      name: Announcer label
      description: Label marking the one speaker per area that should talk.
      selector:
        label:
    mute_entity:
      name: Mute switch (optional)
      description: While this is on, announcements are skipped. Priority announcements still play.
      default: ""
      selector:
        entity:
          filter:
            - domain: input_boolean
            - domain: switch
    quiet_start:
      name: Quiet hours start
      description: Announcements are skipped from this time... (same start and end = no quiet hours)
      default: "00:00:00"
      selector:
        time:
    quiet_end:
      name: Quiet hours end
      description: ...until this time. Priority announcements still play.
      default: "00:00:00"
      selector:
        time:
    gap:
      name: Gap between announcements
      description: Pause after each announcement finishes before the next queued one starts.
      default: 1
      selector:
        number:
          min: 0
          max: 30
          unit_of_measurement: s

fields:
  message:
    name: Message
    required: true
    selector:
      text:
        multiline: true
  areas:
    name: Areas
    description: Only these rooms. Leave empty for every room.
    selector:
      area:
        multiple: true
  speakers:
    name: Speakers
    description: Exact media players to use. Overrides areas and the label.
    selector:
      entity:
        multiple: true
        filter:
          domain: media_player
  voice:
    name: Voice
    description: DECtalk voice name. Leave empty for the add-on's default voice.
    selector:
      text:
  volume:
    name: Volume
    description: Volume for this announcement; the previous volume is restored afterwards. Leave empty to keep the current volume.
    selector:
      number:
        min: 0
        max: 100
        unit_of_measurement: "%"
  priority:
    name: Priority
    description: Play even when muted or during quiet hours (e.g. smoke or leak alerts).
    default: false
    selector:
      boolean:

mode: queued
max: 10

variables:
  tts_entity: !input tts_entity
  announcer_label: !input announcer_label
  mute_entity: !input mute_entity
  quiet_start: !input quiet_start
  quiet_end: !input quiet_end
  gap: !input gap
  players: >-
    {% set to_list = (speakers | default([])) %}
    {% set to_list = [to_list] if to_list is string else to_list %}
    {% if to_list %}
      {{ to_list }}
    {% else %}
      {% set a = areas | default([]) %}
      {% set a = [a] if a is string else a %}
      {% set labelled = label_entities(announcer_label)
           + (label_devices(announcer_label) | map('device_entities') | sum(start=[])) %}
      {% set p = labelled | select('match', 'media_player\.') | unique | list %}
      {{ p if not a else p | select('in', a | map('area_entities') | sum(start=[])) | list }}
    {% endif %}
  skip_reason: >-
    {% set n = now().strftime('%H:%M:%S') %}
    {% set s, e = quiet_start, quiet_end %}
    {% set quiet = s != e and ((s < e and s <= n and n < e) or (s > e and (n >= s or n < e))) %}
    {% set muted = mute_entity is string and mute_entity != '' and is_state(mute_entity, 'on') %}
    {% if priority | default(false) %}{% elif muted %}muted{% elif quiet %}quiet hours{% endif %}
  level: "{{ volume | default(none) }}"
  # Snapshot volumes now so they can be restored after speaking.
  restore: >-
    {% set ns = namespace(r=[]) %}
    {% for p in players %}
      {% set v = state_attr(p, 'volume_level') %}
      {% if v is number %}{% set ns.r = ns.r + [{'entity': p, 'level': v}] %}{% endif %}
    {% endfor %}
    {{ ns.r }}
  # DECtalk speaks roughly 15 characters a second; allow extra for slow speakers.
  max_seconds: "{{ 5 + (message | length / 10) | int }}"

sequence:
  - if: "{{ skip_reason != '' }}"
    then:
      - stop: "Skipped: {{ skip_reason }} (set priority to override)."
  - if: "{{ players | count == 0 }}"
    then:
      - stop: No announcer speakers matched. Check the label and areas.
  - if: "{{ level is number }}"
    then:
      - action: media_player.volume_set
        continue_on_error: true
        target:
          entity_id: "{{ players }}"
        data:
          volume_level: "{{ level / 100 }}"
  - action: tts.speak
    target:
      entity_id: "{{ tts_entity }}"
    data:
      media_player_entity_id: "{{ players }}"
      message: "{{ message }}"
      options: "{{ {'voice': voice} if voice | default('') else {} }}"
  # Wait for playback to finish (bounded) so volume restore and the next announcement don't cut it off.
  - delay: 1
  - wait_template: "{{ players | select('is_state', 'playing') | list | count == 0 }}"
    timeout:
      seconds: "{{ max_seconds }}"
  - if: "{{ level is number }}"
    then:
      - repeat:
          for_each: "{{ restore }}"
          sequence:
            - action: media_player.volume_set
              continue_on_error: true
              target:
                entity_id: "{{ repeat.item.entity }}"
              data:
                volume_level: "{{ repeat.item.level }}"
  - delay:
      seconds: "{{ gap }}"
