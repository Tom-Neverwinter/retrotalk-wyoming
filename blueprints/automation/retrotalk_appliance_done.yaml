blueprint:
  name: Retrotalk - laundry or dishes done
  description: >-
    Announce when a washer, dryer or dishwasher finishes. Works with either a smart plug
    that measures power (finished = power stays below a threshold) or a vibration sensor
    (finished = no vibration). The appliance must stay quiet for a few minutes first, so
    pauses mid-cycle don't count. Speaks through your Retrotalk announce script.
  domain: automation
  source_url: https://github.com/Tom-Neverwinter/retrotalk-wyoming/blob/main/blueprints/automation/retrotalk_appliance_done.yaml
  homeassistant:
    min_version: 2024.10.0
  input:
    sensor:
      name: Power or vibration sensor
      description: >-
        A power sensor in watts (smart plug), or a vibration binary sensor that is on while
        the appliance runs.
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: power
            - domain: binary_sensor
    appliance:
      name: Appliance name
      description: Used in the message.
      default: washing machine
      selector:
        text:
    idle_watts:
      name: Idle below (power sensors only)
      description: The appliance counts as finished while it draws less than this.
      default: 5
      selector:
        number:
          min: 0.5
          max: 100
          step: 0.5
          unit_of_measurement: W
    quiet_minutes:
      name: Finished after this long quiet
      default: 5
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: min
    message:
      name: Message
      description: "{appliance} is replaced by the appliance name."
      default: "[:tone 880,150][:tone 660,250] The {appliance} has finished."
      selector:
        text:
    announce_script:
      name: Announce script
      description: The script you created from the Retrotalk announce blueprint.
      selector:
        entity:
          filter:
            domain: script
    voice:
      name: Voice
      description: Retrotalk voice, e.g. robot. Empty = the add-on's default.
      default: ""
      selector:
        text:
    areas:
      name: Rooms
      description: Only these rooms. Empty = every room.
      default: []
      selector:
        area:
          multiple: true

mode: single
max_exceeded: silent

trigger_variables:
  sensor: !input sensor
  idle_watts: !input idle_watts

triggers:
  # True while the appliance is idle; fires when it turns idle and stays so. Unknown or
  # unavailable readings count as "not finished", so a dropped sensor can't announce.
  - trigger: template
    value_template: >-
      {% if sensor.startswith('binary_sensor.') %}
        {{ is_state(sensor, 'off') }}
      {% else %}
        {{ states(sensor) | is_number and states(sensor) | float < idle_watts }}
      {% endif %}
    for:
      minutes: !input quiet_minutes

variables:
  appliance: !input appliance
  message_template: !input message
  message: "{{ message_template | replace('{appliance}', appliance) }}"

actions:
  - action: script.turn_on
    target:
      entity_id: !input announce_script
    data:
      variables:
        message: "{{ message }}"
        voice: !input voice
        areas: !input areas
