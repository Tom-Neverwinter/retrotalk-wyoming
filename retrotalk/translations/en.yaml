configuration:
  voice:
    name: Default voice
    description: >-
      Used when a request doesn't pick a voice. A built-in (paul, betty, harry, frank,
      dennis, kit, ursula, rita, wendy) or the name of one of your custom voices.
  rate:
    name: Speaking rate
    description: Words per minute for every voice (75-600). Leave unset for each voice's own rate.
  custom_voices:
    name: Custom voices
    description: >-
      Extra voices built from a base voice plus voice settings, e.g. "ap 90 pr 0".
      See the Documentation tab for the settings list.
network:
  10205/tcp: >-
    Wyoming port on the host. Not needed for Home Assistant itself; only enable it for
    Wyoming clients on other machines.
